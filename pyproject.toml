[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molstar-lab"
version = "0.1.0"
description = "Jupyter-Lab-style local launcher for the Mol* molecular viewer: run it in a folder, browse and open structures in the browser."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
molstar-lab = "molstar_lab.server:main"
molstar = "molstar_lab.server:main"

[tool.setuptools]
packages = ["molstar_lab"]

[tool.setuptools.package-data]
molstar_lab = ["static/*"]

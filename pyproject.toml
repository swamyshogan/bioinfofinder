[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinfofinder"
version = "0.2.0"
description = "Jupyter-Lab-style local launcher for the Mol* molecular viewer: run it in a folder, browse and open structures in the browser."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Shogan Swamy" }]
dependencies = []

[project.scripts]
bioinfofinder = "bioinfofinder.server:main"

[tool.setuptools]
packages = ["bioinfofinder"]

[tool.setuptools.package-data]
bioinfofinder = ["static/*"]

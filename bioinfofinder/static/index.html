<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bioinfoFinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Red+Hat+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/molstar.css">
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #d1d9e0;
    --text: #1f2328;
    --muted: #59636e;
    --hover: #f3f5f8;
    --sel: #eef1f5;
    --accent: #3b8eea;        /* light blue: links, active bar, checkboxes */
    --accent-soft: #e8f2fd;   /* light blue fill: primary button, ticked rows */
    --accent-text: #1f6fc9;   /* text on the light fill */
    --folder: #6cb0f5;        /* folder icons */
    --file: #59636e;          /* file icons */
    --sidebar-w: 300px;
    --font: "Plus Jakarta Sans";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--font), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  svg { display: block; }

  #app { display: flex; height: 100vh; }

  /* ---------- sidebar ---------- */
  #sidebar { width: var(--sidebar-w); flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--panel); }
  #app.collapsed #sidebar { display: none; }

  .side-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .side-head h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  .side-head h1 span { color: var(--accent); }

  .iconbtn { width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none;
    border: 1px solid var(--line); border-radius: 6px; background: #f6f8fa; cursor: pointer; color: var(--muted); }
  .iconbtn:hover { background: #eef1f4; color: var(--text); }
  .iconbtn.ghost { border-color: transparent; background: transparent; }
  .iconbtn.ghost:hover { background: var(--hover); }

  .search { margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; color: var(--text); }
  .search kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 5px; color: var(--muted); }

  #tree { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .row { position: relative; display: flex; align-items: center; gap: 6px; height: 34px; padding-right: 8px;
    border-radius: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
  .row:hover { background: var(--hover); }
  .row.current { background: var(--sel); }
  .row.current::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px;
    border-radius: 2px; background: var(--accent); }
  .row.loaded .label { font-weight: 600; }
  .row.loaded .dot { display: block; }
  .chev { width: 16px; height: 16px; flex: none; color: var(--muted); transition: transform .12s; }
  .chev.open { transform: rotate(90deg); }
  .chev.none { visibility: hidden; }
  .ico { width: 16px; height: 16px; flex: none; }
  .ico.folder { color: var(--folder); }
  .ico.file { color: var(--file); }
  .label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .label small { color: var(--muted); font-size: inherit; }
  .none { padding: 16px 12px; color: var(--muted); font-size: 13px; }
  .dot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  /* icon slot: a structure file's icon turns into a checkbox on hover (or while anything is selected) */
  .slot { position: relative; width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
  .check { display: none; width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .row:hover .slot .check, .row.checked .slot .check, #tree.picking .slot .check { display: block; }
  .row:hover .slot .ico, .row.checked .slot .ico, #tree.picking .slot .ico { display: none; }
  .row.checked { background: var(--accent-soft); }

  .selbar { display: none; align-items: center; gap: 8px; padding: 10px 16px 12px; border-top: 1px solid var(--line); }
  #app.picking .selbar { display: flex; }
  .linkbtn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 13px; }
  .linkbtn:hover { color: var(--text); text-decoration: underline; }
  .selbar .btn { flex: 1; }
  .btn:disabled { opacity: .45; cursor: default; filter: none; }

  /* ---------- main: path bar + viewer ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pathbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #expand { display: none; }
  #app.collapsed #expand { display: inline-grid; }
  /* path bar reads like a `pwd` line */
  .crumbs { display: flex; align-items: center; gap: 0; font: 500 14.5px/1.4 "Red Hat Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    min-width: 0; white-space: nowrap; overflow: hidden; }
  .crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs b { font-weight: 600; }
  .crumbs .sep { color: var(--muted); padding: 0 1px; }
  .spacer { flex: 1; }
  #status.err { color: #c2413a; }
  #status { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  .btn { height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: #f6f8fa;
    cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: #eef1f4; }
  .btn.primary { background: var(--accent-soft); border-color: #b9d8fa; color: var(--accent-text); }
  .btn.primary:hover { background: #d9eafc; }

  /* ---------- tabs: one Mol* scene each ---------- */
  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line);
    background: #f6f8fa; overflow-x: auto; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 12px; max-width: 220px;
    border: 0; border-radius: 3px 3px 0 0; color: var(--muted);
    cursor: pointer; user-select: none; white-space: nowrap; font-size: 13px; }
  .tab:hover { background: #eef1f4; color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { width: 18px; height: 18px; display: grid; place-items: center; border: 0; background: none; border-radius: 4px;
    color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; visibility: hidden; flex: none; }
  .tab:hover .x, .tab.active .x { visibility: visible; }
  .tab .x:hover { background: #e1e5ea; color: var(--text); }
  .tab.active .x { color: var(--accent-text); }
  .tab.active .x:hover { background: #d3e6fb; }
  .newtab { width: 28px; height: 28px; margin: 0 0 3px 2px; display: grid; place-items: center; flex: none;
    border: 0; background: none; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 18px; }
  .tab .x, .newtab { padding: 0; }
  .tab .x svg, .newtab svg { pointer-events: none; }
  .newtab:hover { background: #eef1f4; color: var(--text); }

  #viewerWrap { flex: 1; position: relative; min-height: 0; }
  .viewer { position: absolute; inset: 0; visibility: hidden; }
  .viewer.active { visibility: visible; }
  .boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

  /* ---------- Viewer / Raw switch ---------- */
  .seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: #eef1f4; flex: none; }
  .seg button { height: 26px; padding: 0 12px; border: 1px solid transparent; border-radius: 5px; background: none;
    color: var(--text); cursor: pointer; font-size: 13px; }
  .seg button:hover:not(.on):not(:disabled) { background: #e3e7ec; }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; }
  .seg button svg { color: var(--accent); flex: none; pointer-events: none; }
  .seg button.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }

  /* ---------- raw text view ---------- */
  .raw { position: absolute; inset: 0; z-index: 5; display: none; overflow: auto; background: var(--bg); }
  #main.rawmode .raw { display: block; }

  /* ---------- image / pdf preview ---------- */
  .preview { position: absolute; inset: 0; z-index: 5; display: none; overflow: auto; background: #f6f8fa; }
  #main.previewmode .preview { display: grid; place-items: center; }
  .preview img { max-width: calc(100% - 48px); max-height: calc(100% - 48px); object-fit: contain; background: #fff;
    border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; }
  .preview.actual { place-items: start; }
  .preview.actual img { max-width: none; max-height: none; margin: 24px; cursor: zoom-out; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .seg.hidden { display: none; }
  .raw .code { display: flex; min-width: max-content; padding: 8px 0 24px;
    font: 12.5px/1.6 "Red Hat Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .raw pre { margin: 0; font: inherit; }
  .raw .ln { position: sticky; left: 0; padding: 0 12px 0 16px; text-align: right; color: #8c959f; background: var(--bg);
    user-select: none; border-right: 1px solid var(--line); }
  .raw .tx { padding: 0 16px; color: var(--text); }
  .raw .msg { padding: 24px; color: var(--muted); }
  .raw .more { padding: 0 16px 24px 16px; color: var(--muted); font-size: 12px; }

  /* ---------- no tabs open ---------- */
  .empty { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; background: var(--bg); }
  #main.notabs .empty, #main.emptytab .empty { display: grid; }
  #main.notabs .tabs { display: none; }
  .empty .box { text-align: center; }
  .empty .box { padding: 14px 18px; border: 1px solid var(--line); border-radius: 6px; background: #f6f8fa;
    font-size: 12.5px; color: var(--muted); max-width: min(400px, 90%); }
  .empty p { margin: 0; }
  .empty p + p { margin-top: 4px; }

  /* ---------- sidebar resize + drop target ---------- */
  #resizer { width: 5px; margin-left: -3px; cursor: col-resize; flex: none; z-index: 5; }
  #resizer:hover, #resizer.drag { background: var(--accent); opacity: .4; }
  #app.collapsed #resizer { display: none; }
  #dropzone { position: fixed; inset: 0; z-index: 2000; display: none; place-items: center; font-size: 16px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); border: 3px dashed var(--accent); color: var(--accent-text); }
  #dropzone.on { display: grid; }
  .preview .msg { padding: 24px; color: var(--muted); }

  /* ---------- right-click menu ---------- */
  .menu { position: fixed; z-index: 1000; min-width: 190px; padding: 4px; display: none;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(31,35,40,.12); }
  .menu.on { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px;
    border-radius: 5px; cursor: pointer; font-size: 13px; }
  .menu button:hover { background: var(--accent-soft); color: var(--accent-text); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <button class="iconbtn" id="collapseBtn" title="Hide files">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75C0 1.784.784 1 1.75 1ZM1.5 2.75v10.5c0 .138.112.25.25.25H5v-11H1.75a.25.25 0 0 0-.25.25ZM6.5 13.5h7.75a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25H6.5Z"/></svg>
      </button>
      <h1>bioinfo<span>Finder</span></h1>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 1 1-1.06 1.06ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      <input id="filter" placeholder="Go to file" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div id="tree"></div>
    <div class="selbar">
      <button class="btn" id="unpickBtn">Cancel</button>
      <button class="btn primary" id="addBtn" disabled>Add to scene</button>
    </div>
  </aside>
  <div id="resizer"></div>

  <main id="main">
    <div class="pathbar">
      <button class="iconbtn" id="expand" title="Show files">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75C0 1.784.784 1 1.75 1ZM1.5 2.75v10.5c0 .138.112.25.25.25H5v-11H1.75a.25.25 0 0 0-.25.25ZM6.5 13.5h7.75a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25H6.5Z"/></svg>
      </button>
      <nav class="crumbs" id="crumbs"></nav>
      <button class="iconbtn ghost" id="copyBtn" title="Copy path">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
      </button>
      <span class="spacer"></span>
      <span id="status"></span>
      <div class="seg" id="modeSeg"><button class="on" data-mode="viewer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5 14 4.75v6.5L8 14.5l-6-3.25v-6.5Z"/><path d="M2 4.75 8 8l6-3.25M8 8v6.5"/></svg>Viewer</button><button data-mode="raw"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="m11.28 3.22 4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L13.94 8l-3.72-3.72a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215Zm-6.56 0a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L2.06 8l3.72 3.72a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L.47 8.53a.75.75 0 0 1 0-1.06Z"/></svg>Raw</button></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="viewerWrap">
      <div class="raw" id="raw"></div>
      <div class="preview" id="preview"></div>
      <div class="empty" id="empty"><div class="box">
        <p>Select a file in the sidebar to open it.</p>
        <p>To open several together, hover a file and tick its box.</p>
      </div></div>
    </div>
  </main>
</div>
<div class="menu" id="menu"></div>
<div id="dropzone">Drop files to open them</div>

<script src="/static/molstar.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('bioinfofinder:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bioinfofinder:' + k, JSON.stringify(v)); } catch {} },
};
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fileUrl = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');
const baseName = p => p.split('/').pop();
const stripGz = n => n.replace(/\.gz$/i, '');                 // the server gunzips .gz for us
const ext = n => (stripGz(n).toLowerCase().match(/\.([a-z0-9]+)$/) || [, ''])[1];
const isImage = n => /^(png|jpe?g|gif|webp|svg|bmp|ico|tiff?)$/.test(ext(n));
const isPdf = n => ext(n) === 'pdf';

// ---------------- state ----------------
// Paths are relative to the folder bioinfofinder was started in ('' = that folder).
const S = {
  root: 'root',
  dirs: new Map(),          // folder path -> entries from /api/list
  entries: new Map(),       // path -> entry (every file or folder seen so far)
  open: new Set(['']),      // expanded folders
  current: '',              // file or folder selected in the sidebar
  picked: new Set(),        // ticked Mol* files
  hits: null,               // search results (null = show the tree)
  tabs: [], active: null, nextId: 1,
};
const entry = p => S.entries.get(p);
const isMol = p => !!entry(p)?.kind;                          // Mol* can open it
const isDir = p => p === '' || !!entry(p)?.dir;
const tab = () => S.tabs.find(t => t.id === S.active);
const loaded = () => new Set([...(tab()?.loaded ?? []), tab()?.text].filter(Boolean));

// ---------------- server ----------------
async function api(url) {
  const r = await fetch(url), j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function loadDir(path, { quiet = false } = {}) {
  try {
    const j = await api('/api/list?path=' + encodeURIComponent(path));
    const sig = JSON.stringify(j.entries.map(e => [e.name, e.size, e.mtime]));
    if (quiet && S.dirs.get(path)?.sig === sig) return false;
    j.entries.sig = sig;
    S.dirs.set(path, j.entries);
    for (const e of j.entries) S.entries.set(e.path, e);
    return true;
  } catch (e) {
    if (!quiet) status(e.message, true);
    S.open.delete(path);
    return false;
  }
}
async function expandTo(path) {                                // open every folder above `path`
  const parts = path.split('/');
  for (let i = 0; i < parts.length; i++) {
    const dir = parts.slice(0, i).join('/');
    S.open.add(dir);
    if (!S.dirs.has(dir)) await loadDir(dir);
  }
}

// ---------------- icons ----------------
const ICON = {
  chev: '<svg class="chev{c}" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>',
  folder: '<svg class="ico folder" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>',
  folderOpen: '<svg class="ico folder" viewBox="0 0 16 16" fill="currentColor"><path d="M.513 1.513A1.75 1.75 0 0 1 1.75 1h3.5c.55 0 1.07.26 1.4.7l.9 1.2a.25.25 0 0 0 .2.1H13a1 1 0 0 1 1 1v.5H2.75a.75.75 0 0 0 0 1.5h11.978a1 1 0 0 1 .994 1.117L15 13.25A1.75 1.75 0 0 1 13.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75c0-.464.184-.91.513-1.237Z"/></svg>',
  file: '<svg class="ico file" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>',
  image: '<svg class="ico file" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><circle cx="5.5" cy="6.25" r="1.1" fill="currentColor" stroke="none"/><path d="m2.5 12 3.75-3.5 2.5 2.25 2-1.75 3 2.75"/></svg>',

const MODEL_FMT = { pdb: 'pdb', ent: 'pdb', cif: 'mmcif', mmcif: 'mmcif', bcif: 'mmcif', gro: 'gro', pdbqt: 'pdbqt', xyz: 'xyz', mol: 'mol', sdf: 'sdf', mol2: 'mol2' };

  if (trajs.length === 1 && models.length === 1 && es.length === 2) {          // topology + trajectory = MD run
    const [m, c] = [models[0], trajs[0]], me = ext(m.name), ce = ext(c.name), isTop = !!TOP_FMT[me];

      modelLabel: m.name,

async function openPaths(paths, { add = false, t = tab() } = {}) {
  paths = paths.filter(p => entry(p) && !entry(p).dir);
  if (!paths.length) return;
  const mol = paths.filter(isMol);
  S.current = paths.at(-1);
  t ??= newTab();
  if (!mol.length) {                                            // text, image or pdf: the tab shows this file
    if (t.files.length) { t.viewer?.plugin.clear(); t.files = []; t.loaded.clear(); }
    t.text = paths[0];

  if (t.text) { t.text = null; add = false; }                   // tab was showing a file: start a fresh scene
  render(); renderTabs();
  await ensureViewer(t); if (!t.viewer) return;
  const names = mol.map(baseName).join(', ');
  if (t === tab()) status(`Loading ${names}…`);
  // Mol*'s "Open Files" jumps the left panel to the State Tree; put it back afterwards.
  const plugin = t.viewer.plugin, layout = plugin.behaviors.layout;

  } catch (e) { console.error(e); status(`Failed: ${e.message || e}`, true); }

    if (layout.leftPanelTabName.value !== prevTab) layout.leftPanelTabName.next(prevTab);

async function unzip(buf) {

    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);

});

// ---------------- right-click menu ----------------
function showMenu(x, y, items) {
  const m = $('menu');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}">${esc(it.label)}</button>`).join('');
  m.onclick = e => { const b = e.target.closest('button'); if (b) { hideMenu(); items[+b.dataset.i].run(); } };
  m.classList.add('on');
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
}
const hideMenu = () => $('menu').classList.remove('on');
$('tree').addEventListener('contextmenu', e => {
  const r = e.target.closest('.row'); if (!r) return;
  const path = r.dataset.path, en = entry(path);
  if (en.dir) return;                                           // folders keep the normal browser menu
  e.preventDefault();
  const many = S.picked.has(path) && S.picked.size > 1 ? [...S.picked] : null;
  const done = () => { S.picked.clear(); render(); };
  showMenu(e.clientX, e.clientY, many ? [
    { label: `Open ${many.length} in new tab`, run: () => { done(); openInNewTab(many); } },
    { label: `Add ${many.length} to scene`, run: () => { done(); openPaths(many, { add: true }); } },
  ] : [
    { label: 'Open', run: () => openPaths([path]) },
    { label: 'Open in new tab', run: () => openInNewTab([path]) },
    ...(en.kind ? [{ label: 'Add to scene', run: () => openPaths([path], { add: true }) }] : []),
    '-',
    { label: 'Copy path', run: () => navigator.clipboard?.writeText(path) },
  ]);
});
addEventListener('mousedown', e => { if (!e.target.closest('#menu')) hideMenu(); });
addEventListener('blur', hideMenu);
$('tree').addEventListener('scroll', hideMenu);

// ---------------- tab strip ----------------
$('tabs').addEventListener('click', e => {
  if (e.target.id === 'newTabBtn') return newTab();
  const el = e.target.closest('.tab'); if (!el) return;
  e.target.classList.contains('x') ? closeTab(+el.dataset.id) : activateTab(+el.dataset.id);
});
$('tabs').addEventListener('auxclick', e => {                    // middle-click closes a tab
  const el = e.target.closest('.tab'); if (el && e.button === 1) closeTab(+el.dataset.id);
});

// ---------------- keyboard ----------------
addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideMenu(); if (S.picked.size) unpick(); }
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('filter').focus(); }
});

// ---------------- collapse + resize sidebar ----------------
const app = $('app');
const setCollapsed = c => { app.classList.toggle('collapsed', c); store.set('collapsed', c); setTimeout(() => tab()?.viewer?.handleResize(), 0); };
$('collapseBtn').onclick = () => setCollapsed(true);
$('expand').onclick = () => setCollapsed(false);
if (store.get('collapsed', false)) app.classList.add('collapsed');
const w = store.get('width', null); if (w) document.documentElement.style.setProperty('--sidebar-w', w + 'px');
$('resizer').onpointerdown = ev => {
  const r = $('resizer'); r.classList.add('drag'); r.setPointerCapture(ev.pointerId);
  const clamp = x => Math.min(Math.max(220, x), innerWidth * .6);
  r.onpointermove = m => document.documentElement.style.setProperty('--sidebar-w', clamp(m.clientX) + 'px');
  r.onpointerup = u => { r.classList.remove('drag'); r.onpointermove = r.onpointerup = null;
    store.set('width', clamp(u.clientX)); tab()?.viewer?.handleResize(); };
};

// ---------------- drag files in from Finder ----------------
let dragDepth = 0;
const dz = $('dropzone');
addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragDepth++; dz.classList.add('on'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dz.classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; dz.classList.remove('on');
  const files = [...(e.dataTransfer?.files || [])]; if (!files.length) return;
  let t = tab(); if (!t || t.text) t = newTab();
  await ensureViewer(t); if (!t.viewer) return;
  try { await t.viewer.loadFiles(files); t.files.push(...files.map(f => f.name)); }
  catch (err) { status(`Failed: ${err.message || err}`, true); }
  render(); renderTabs();
}, true);

// ---------------- live folder updates ----------------
// Re-read open folders every few seconds so new outputs show up while a job runs.
setInterval(async () => {
  if (document.hidden || S.hits) return;
  let changed = false;
  for (const d of [...S.open]) if (await loadDir(d, { quiet: true })) changed = true;
  if (changed) renderTree();
}, 3000);

// ---------------- boot ----------------
(async () => {
  try {
    const info = await api('/api/info');
    S.root = info.name; document.title = `${info.name} — bioinfoFinder`;
  } catch {}
  await loadDir('');
  const toOpen = new URLSearchParams(location.search).get('open');
  const start = toOpen || decodeURIComponent(location.hash.slice(1) || '');
  if (start) {
    await expandTo(start);
    if (entry(start)) {
      S.current = start;
      if (entry(start).dir) { S.open.add(start); await loadDir(start); }
    }
  }
  render(); renderTabs();
  if (toOpen && entry(toOpen) && !entry(toOpen).dir) {
    history.replaceState(null, '', location.pathname + '#' + encodeURIComponent(toOpen));
    openPaths([toOpen]);
  }
})();
})();
</script>
</body>
</html>
